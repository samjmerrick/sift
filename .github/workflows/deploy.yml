# Test, then (only when the repository variable DEPLOY_PAGES is "true") publish the app to GitHub Pages.
# This repository's own Sift runs on bee (bee/README.md), so it leaves DEPLOY_PAGES unset and only tests.
# Required repository variables: SUPABASE_URL and SUPABASE_ANON_KEY (public values; written to public/config.js).
# With the backend on bee (bee/README.md), SUPABASE_URL is the bee server's address and the key can be any value.
# Optional: also deploy database migrations + the Edge Function with the Supabase CLI. Set the repository variable
# SUPABASE_PROJECT_REF and the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD. Without them, apply
# migrations and deploy the function yourself (see the README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sift_test

  supabase:
    needs: test
    if: ${{ vars.DEPLOY_PAGES == 'true' && vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push
      - name: Deploy Edge Function
        run: supabase functions deploy sift-fetch --project-ref "$PROJECT_REF"

  pages:
    needs: [test, supabase]
    # Deploy even when the Supabase job is skipped (not configured), but not when it failed.
    if: ${{ always() && vars.DEPLOY_PAGES == 'true' && needs.test.result == 'success' && needs.supabase.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write public/config.js from repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the repository variables SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions > Variables). See the README, step 4."
            exit 1
          fi
          node -e '
            const cfg = { supabaseUrl: process.env.SUPABASE_URL, supabaseKey: process.env.SUPABASE_ANON_KEY };
            require("fs").writeFileSync("public/config.js", "window.SIFT_CONFIG = " + JSON.stringify(cfg) + ";\n");
          '
      - name: Stamp build id
        run: sed -i "s/window.SIFT_BUILD = 'dev';/window.SIFT_BUILD = '${GITHUB_SHA::7}';/; s/app.js?v=dev/app.js?v=${GITHUB_SHA::7}/" public/index.html && grep -c "SIFT_BUILD = '${GITHUB_SHA::7}'" public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
