# Fetch all enabled sources into Supabase every hour. Needs the DATABASE_URL secret
# (Supabase → Connect → Session pooler connection string, with your database password filled in).
name: Fetch feeds

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Fetch sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set; skipping."; exit 0; fi
          node scripts/fetch.js
