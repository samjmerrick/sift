<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sift">
  <title>Sift</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="wordmark">Sift</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="topics-btn" aria-label="Filter topics" title="Filter topics" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        </button>
        <button class="icon-btn" id="refresh" aria-label="Refresh feed" title="Refresh feed">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="typebar" id="typebar" hidden><div class="typebar-in"><div class="seg" role="group" aria-label="Show"></div></div></div>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/" data-tab="feed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Feed</span>
    </a>
    <a href="#/saved" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Saved</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span>
    </a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // Startup diagnostics: if the app hasn't drawn anything after a few seconds, show what went wrong.
    window.SIFT_BUILD = 'dev';
    window.SIFT_ERRORS = [];
    window.addEventListener('error', function (e) {
      SIFT_ERRORS.push((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    }, true);
    window.addEventListener('error', function (e) {
      if (e.target && e.target.src) SIFT_ERRORS.push('failed to load ' + e.target.src);
    }, true);
    window.addEventListener('unhandledrejection', function (e) { SIFT_ERRORS.push('unhandled: ' + (e.reason && e.reason.message || e.reason)); });
    setTimeout(function () {
      var view = document.getElementById('view');
      if (!view || view.children.length) return;
      var box = document.createElement('div');
      box.className = 'login';
      box.innerHTML = '<h2>Sift</h2><p class="sub">The app didn\'t start. Please send this to whoever set it up:</p>';
      var pre = document.createElement('pre');
      pre.style.cssText = 'text-align:left;white-space:pre-wrap;font-size:12px;background:var(--surface-2);padding:10px;border-radius:8px';
      pre.textContent = 'build: ' + SIFT_BUILD + '\nurl: ' + location.href + '\nbrowser: ' + navigator.userAgent +
        '\nconfig: ' + (window.SIFT_CONFIG ? (SIFT_CONFIG.supabaseUrl ? 'url ok' : 'NO URL') + ', ' + (SIFT_CONFIG.supabaseKey ? 'key ok' : 'NO KEY') : 'missing') +
        '\nsupabase lib: ' + (window.supabase ? 'loaded' : 'NOT loaded') +
        '\nerrors:\n' + (SIFT_ERRORS.join('\n') || '(none)');
      var btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = 'Clear cache and reload';
      btn.onclick = async function () {
        try {
          var reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
          if (reg) await reg.unregister();
          if (window.caches) for (var k of await caches.keys()) if (k.indexOf('sift-') === 0) await caches.delete(k);
        } catch (_) {}
        location.replace(location.pathname + '?r=' + Date.now());
      };
      box.append(pre, btn);
      view.append(box);
    }, 6000);
  </script>
  <script src="config.js"></script>
  <script src="vendor/supabase-js-2.118.0.js"></script>
  <script type="module" src="app.js?v=dev"></script>
</body>
</html>
